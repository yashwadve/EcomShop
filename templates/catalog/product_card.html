<div class="card h-100 border-0 shadow-sm product-card">
  <div class="position-relative">
    {% if product.is_featured %}
      <span class="badge badge-featured position-absolute top-0 start-0 m-2">Featured</span>
    {% endif %}
    {% if product.images.first %}
      <img src="{{ product.images.first.image.url }}" class="card-img-top product-card-img" alt="{{ product.name }}">
    {% else %}
      <div class="bg-light product-card-img"></div>
    {% endif %}
  </div>
  <div class="card-body d-flex flex-column">
    <h6 class="card-title mb-1">{{ product.name }}</h6>
    <p class="text-muted small mb-2">{{ product.short_description|default:""|truncatechars:60 }}</p>
    <p class="fw-bold text-primary mb-3">₹{{ product.price }}</p>
    <a href="{% url 'catalog:product_detail' product.slug %}" class="btn btn-outline-primary btn-sm rounded-pill mt-auto">View Details</a>
  </div>
</div>
