<div class="card shadow-sm border-0 text-center p-3">
  <div class="profile-avatar mx-auto mb-2">
    <i class="bi bi-person-fill fs-2 text-secondary"></i>
  </div>
  <h6 class="fw-bold mb-0">{{ user.first_name }} {{ user.last_name }}</h6>
  <small class="text-muted">{{ user.email }}</small>
  <hr>
  <div class="list-group list-group-flush text-start">
    <a href="{% url 'accounts:my_profile' %}" class="list-group-item list-group-item-action {% if active == 'profile' %}active{% endif %}">
      <i class="bi bi-person me-2"></i>Profile
    </a>
    <a href="{% url 'accounts:my_addresses' %}" class="list-group-item list-group-item-action {% if active == 'addresses' %}active{% endif %}">
      <i class="bi bi-geo-alt me-2"></i>Addresses
    </a>
    <form method="POST" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button type="submit" class="list-group-item list-group-item-action text-danger">
        <i class="bi bi-box-arrow-right me-2"></i>Log Out
      </button>
    </form>
  </div>
</div>
